<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>KeepBonds</title>
<style>
  /* Quicksand y Lexend (SIL Open Font License) van dentro de la app para que se vean igual sin internet. */
  /* latin-ext */
  @font-face {
    font-family: 'Lexend';
    font-style: normal;
    font-weight: 400 800;
    font-display: swap;
    src: url(fonts/lexend-latin-ext.woff2) format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  /* latin */
  @font-face {
    font-family: 'Lexend';
    font-style: normal;
    font-weight: 400 800;
    font-display: swap;
    src: url(fonts/lexend-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  /* latin-ext */
  @font-face {
    font-family: 'Quicksand';
    font-style: normal;
    font-weight: 500 700;
    font-display: swap;
    src: url(fonts/quicksand-latin-ext.woff2) format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  /* latin */
  @font-face {
    font-family: 'Quicksand';
    font-style: normal;
    font-weight: 500 700;
    font-display: swap;
    src: url(fonts/quicksand-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root{
    --cream:#F6EFE2;
    --surface:#FFFCF6;
    --surface-2:#EFE6D2;
    --sage:#74845F;
    --sage-deep:#4B5A3C;
    --sage-soft:#DEE5CE;
    --terracotta:#C97B54;
    --terracotta-deep:#A64F35;
    --terracotta-soft:#F1DECB;
    --ink:#362F24;
    --ink-soft:#7C7361;
    --ink-faint:#B0A692;
    --line:#E7DCC5;
    --line-soft:rgba(54,47,36,0.05);
    --font-display:'Quicksand', ui-rounded, system-ui, sans-serif;
    --font-body:'Lexend', ui-sans-serif, system-ui, sans-serif;
  }
  .app-root.theme-dark{
    --cream:#221E19;
    --surface:#2B2620;
    --surface-2:#3A3428;
    --ink:#F1EADB;
    --ink-soft:#C7BCA3;
    --ink-faint:#8B8168;
    --line:#463F31;
    --line-soft:rgba(255,255,255,0.06);
  }

  *{box-sizing:border-box;}
  button{
    font: inherit; color: inherit; background: none; border: none; margin: 0; padding: 0;
    cursor: pointer; -webkit-tap-highlight-color: transparent; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  button:focus{ outline: none; }
  html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:var(--font-body);
  }
  #root{height:100%;}
  .font-display{ font-family:var(--font-display); }
  h1,h2,h3,.font-display{ text-wrap:balance; }
  .tabular{ font-variant-numeric: tabular-nums; }

  .app-root{
    height:100dvh; width:100%;
    background:var(--cream);
    color:var(--ink);
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .screen-scroll{
    flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;
    scrollbar-width:none;
  }
  .screen-scroll::-webkit-scrollbar{ display:none; }

  .hscroll{ overflow-x:auto; scrollbar-width:none; scroll-snap-type:x proximity; }
  .hscroll::-webkit-scrollbar{ display:none; }

  .card{
    background:var(--surface);
    border-radius:1.4rem;
    box-shadow: 0 10px 24px -16px rgba(60,45,20,0.28), 0 1px 0 rgba(60,45,20,0.04);
    border:1px solid var(--line-soft);
  }

  .icon-btn{
    width:40px; height:40px; border-radius:999px; background:var(--surface);
    display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0;
    box-shadow: 0 8px 18px -12px rgba(60,45,20,0.4);
    border:1px solid var(--line-soft);
    transition: transform .12s ease;
  }
  .icon-btn:active{ transform:scale(.93); }
  .icon-btn .badge-count{
    position:absolute; top:-4px; right:-4px; min-width:17px; height:17px; padding:0 4px; border-radius:999px;
    background:var(--terracotta-deep); box-shadow:0 0 0 2px var(--surface);
    color:#FBF3E9; font-size:.62rem; font-weight:700; line-height:17px; text-align:center;
  }
  .icon-btn .badge-dot{
    position:absolute; top:6px; right:7px; width:7px; height:7px; border-radius:999px;
    background:var(--terracotta-deep); box-shadow:0 0 0 2px var(--surface);
  }

  .status-pill{
    display:inline-flex; align-items:center; gap:5px;
    padding:.28rem .6rem; border-radius:999px; font-weight:700; font-size:.78rem;
  }

  .chip{
    font-family:var(--font-body); font-weight:600; font-size:.78rem;
    padding:.4rem .9rem; border-radius:999px; white-space:nowrap;
    border:1px solid var(--line); color:var(--ink-soft);
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip[data-active="true"]{
    background:var(--sage-deep); border-color:var(--sage-deep); color:#F6F3E9;
  }

  .btn-primary{
    background:var(--sage-deep); color:#F8F5EA;
    border-radius:1.1rem; font-weight:700; letter-spacing:.01em;
    transition: transform .12s ease, background .15s ease;
  }
  .btn-primary:active{ transform:scale(.98); background:var(--sage); }

  .switch-track{
    width:44px; height:26px; border-radius:999px; background:var(--surface-2);
    border:1px solid var(--line); position:relative; transition:background .15s ease;
    flex-shrink:0;
  }
  .switch-track[data-on="true"]{ background:var(--sage); border-color:var(--sage); }
  .switch-thumb{
    position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:999px;
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25);
    transition:left .15s ease;
  }
  .switch-track[data-on="true"] .switch-thumb{ left:20px; }

  .segbtn{
    border:1px solid var(--line); border-radius:.9rem; padding:.55rem .5rem;
    font-weight:600; font-size:.82rem; color:var(--ink-soft); text-align:center;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .segbtn[data-active="true"]{ background:var(--terracotta-soft); border-color:var(--terracotta); color:var(--terracotta-deep); }

  .field-label{ font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); }

  .input{
    width:100%; border:1px solid var(--line); background:var(--surface);
    border-radius:.9rem; padding:.7rem .85rem; font-family:var(--font-body);
    font-size:.92rem; color:var(--ink); outline:none;
  }
  .input:focus{ border-color:var(--sage); box-shadow:0 0 0 3px color-mix(in srgb, var(--sage) 20%, transparent); }

  .toast{
    position:absolute; left:50%; bottom:96px; transform:translateX(-50%);
    background:var(--ink); color:var(--cream); font-size:.82rem; font-weight:600;
    padding:.65rem 1.1rem; border-radius:999px; box-shadow:0 12px 24px -8px rgba(0,0,0,.4);
    z-index:50; white-space:nowrap;
    animation: toastIn .28s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes toastIn{
    from{ opacity:0; transform:translateX(-50%) translateY(10px) scale(.96); }
    to{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  }

  .sheet-backdrop{ animation: backdropIn .18s ease both; }
  @keyframes backdropIn{ from{ opacity:0; } to{ opacity:1; } }

  .sheet-pop{ animation: sheetUp .26s cubic-bezier(.2,.8,.2,1) both; overflow:hidden; }
  @keyframes sheetUp{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }

  .icon-btn, .btn-primary, .chip, .segbtn{ transition-property: transform, background, color, border-color; }
  .icon-btn:active, .chip:active, .segbtn:active{ transform:scale(.94); }

  .screen-enter{ animation: screenIn .22s ease both; padding-top: env(safe-area-inset-top, 0px); }
  @keyframes screenIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0);} }

  @media (prefers-reduced-motion: reduce){
    .screen-enter, .toast, .sheet-backdrop, .sheet-pop{ animation:none; }
    .btn-primary,.chip,.segbtn,.switch-track,.switch-thumb,.icon-btn{ transition:none; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="bundle.js"></script>
</body>
</html>
