function App(){
  const [contacts, setContacts] = useState(loadContacts);
  const [screen, setScreen] = useState("home");
  const [selectedId, setSelectedId] = useState(null);
  const [filter, setFilter] = useState("Todos");
  const [toast, setToast] = useState("");
  const [backupOpen, setBackupOpen] = useState(false);
  const [logOpen, setLogOpen] = useState(false);
  const [settings, setSettings] = useState(loadSettings);

  useEffect(()=>{
    try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){ /* no-op: modo offline sin persistencia disponible */ }
  },[settings]);

  useEffect(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(contacts)); }catch(e){ /* no-op: modo offline sin persistencia disponible */ }
    scheduleNotifications(contacts);
  },[contacts]);

  useEffect(()=>{
    if(!toast) return;
    const hasAction = typeof toast === "object" && toast.actionLabel;
    const t = setTimeout(()=>setToast(""), hasAction ? 4000 : 2200);
    return ()=>clearTimeout(t);
  },[toast]);

  function updateSetting(key, value){
    setSettings(s=>({...s, [key]:value}));
  }

  function restoreSample(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    setContacts(INITIAL_CONTACTS.map(normalizeContact));
    setScreen("home");
    setToast("Datos de ejemplo restaurados");
  }

  function deleteAllData(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    setContacts([]);
    setScreen("home");
    setToast("Todos los contactos fueron borrados");
  }

  const selected = contacts.find(c=>c.id===selectedId) || null;

  function markToday(id){
    const c = contacts.find(c=>c.id===id);
    const today = todayISO();
    setContacts(cs=>cs.map(c=> c.id===id
      ? {...c, history:[{date:today, note:""}, ...((c.history||[]).filter(h=>h.date!==today))].slice(0,12)}
      : c));
    if(c) setToast(`Registrado: hablaste con ${c.name.split(" ")[0]} hoy`);
  }

  function logCall(id, note){
    const c = contacts.find(c=>c.id===id);
    const today = todayISO();
    const trimmedNote = (note || "").trim();
    setContacts(cs=>cs.map(c=>{
      if(c.id!==id) return c;
      return {...c, history:[{date:today, note:trimmedNote}, ...((c.history||[]).filter(h=>h.date!==today))].slice(0,12)};
    }));
    if(c) setToast(`Llamada registrada con ${c.name.split(" ")[0]}`);
  }

  function addContact(data){
    const nextId = Math.max(0, ...contacts.map(c=>c.id), 0) + 1;
    setContacts(cs=>[{ id:nextId, name:data.name, phone:data.phone || "", photo:data.photo || "", role:data.role, priority:data.priority,
                        birthday:data.birthday || null, remind:settings.defaultRemind, notif:true,
                        notes:data.notes || "", history:[{date:todayISO(), note:""}], freq:data.freq || settings.defaultFreq }, ...cs]);
    setToast(`${data.name.split(" ")[0]} fue añadido a tu círculo`);
    setScreen("home");
  }

  function setNotes(id, notes){
    setContacts(cs=>cs.map(c=>c.id===id ? {...c, notes} : c));
  }

  function setBirthdayNote(id, birthdayNote){
    const c = contacts.find(c=>c.id===id);
    setContacts(cs=>cs.map(c=>c.id===id ? {...c, birthdayNote} : c));
    if(c) setToast(birthdayNote ? `Nota guardada para ${c.name.split(" ")[0]}` : `Nota eliminada`);
  }

  function updateContact(id, data){
    setContacts(cs=>cs.map(c=>c.id===id ? {...c, ...data} : c));
    setToast("Cambios guardados");
    setScreen("detail");
  }

  function deleteContact(id){
    const idx = contacts.findIndex(c=>c.id===id);
    if(idx===-1) return;
    const c = contacts[idx];
    setContacts(cs=>cs.filter(c=>c.id!==id));
    setScreen("home");
    setToast({
      text: `${c.name.split(" ")[0]} fue eliminado de tu círculo`,
      actionLabel: "Deshacer",
      onAction: () => {
        setContacts(cs=>{
          const copy = [...cs];
          copy.splice(Math.min(idx, copy.length), 0, c);
          return copy;
        });
        setToast("Contacto restaurado");
      },
    });
  }

  function snoozeContact(id, days){
    const c = contacts.find(c=>c.id===id);
    const until = isoDaysFromNow(days);
    setContacts(cs=>cs.map(c=>c.id===id ? {...c, snoozedUntil:until} : c));
    if(c) setToast(`${c.name.split(" ")[0]} pospuesto hasta ${formatDateEs(until)}`);
  }

  function cancelSnooze(id){
    setContacts(cs=>cs.map(c=>c.id===id ? {...c, snoozedUntil:null} : c));
    setToast("Se canceló posponer");
  }

  function addImportantDate(id, data){
    setContacts(cs=>cs.map(c=>c.id===id ? {...c, importantDates:[...(c.importantDates||[]), data]} : c));
    setToast(`"${data.label}" añadida`);
  }

  function deleteImportantDate(id, dateId){
    setContacts(cs=>cs.map(c=>c.id===id ? {...c, importantDates:(c.importantDates||[]).filter(d=>d.id!==dateId)} : c));
    setToast("Fecha eliminada");
  }

  if(!settings.onboarded){
    return (
      <div className={`app-root ${settings.theme==="dark" ? "theme-dark" : ""}`}>
        <OnboardingScreen onFinish={(name)=>{
          setSettings(s=>({...s, userName: name || "Tú", onboarded:true}));
        }} />
      </div>
    );
  }

  return (
    <div className={`app-root ${settings.theme==="dark" ? "theme-dark" : ""}`}>
      <div style={{flex:1, position:"relative", minHeight:0}}>
        {screen==="home" && (
          <HomeScreen
            contacts={contacts}
            filter={filter}
            setFilter={setFilter}
            onOpenContact={(id)=>{ setSelectedId(id); setScreen("detail"); }}
            onOpenSettings={()=>setScreen("settings")}
            onSetBirthdayNote={setBirthdayNote}
            userName={settings.userName}
            compact={settings.compact}
          />
        )}
        {screen==="detail" && selected && (
          <DetailScreen
            contact={selected}
            onBack={()=>setScreen("home")}
            onEdit={()=>setScreen("edit")}
            onMarkedToday={()=>markToday(selected.id)}
            onSetRemind={(d)=>setContacts(cs=>cs.map(c=>c.id===selected.id?{...c,remind:d}:c))}
            onToggleNotif={()=>setContacts(cs=>cs.map(c=>c.id===selected.id?{...c,notif:!c.notif}:c))}
            onSetNotes={(notes)=>setNotes(selected.id, notes)}
            onSetBirthdayNote={(note)=>setBirthdayNote(selected.id, note)}
            onSnooze={(days)=>snoozeContact(selected.id, days)}
            onCancelSnooze={()=>cancelSnooze(selected.id)}
            onAddImportantDate={(data)=>addImportantDate(selected.id, data)}
            onDeleteImportantDate={(dateId)=>deleteImportantDate(selected.id, dateId)}
          />
        )}
        {screen==="edit" && selected && (
          <EditContactScreen
            contact={selected}
            onSave={(data)=>updateContact(selected.id, data)}
            onCancel={()=>setScreen("detail")}
            onDelete={()=>deleteContact(selected.id)}
          />
        )}
        {screen==="add" && (
          <AddScreen onSave={addContact} onCancel={()=>setScreen("home")} defaultFreq={settings.defaultFreq} />
        )}
        {screen==="settings" && (
          <SettingsScreen
            settings={settings}
            onUpdate={updateSetting}
            onBack={()=>setScreen("home")}
            onOpenBackup={()=>setBackupOpen(true)}
            onRestoreSample={restoreSample}
            onDeleteAll={deleteAllData}
          />
        )}
        {toast && (
          <div className="toast" style={typeof toast === "object" ? {display:"flex", alignItems:"center", gap:10} : undefined}>
            <span>{typeof toast === "string" ? toast : toast.text}</span>
            {typeof toast === "object" && toast.actionLabel && (
              <button onClick={()=>{ toast.onAction(); setToast(""); }}
                style={{fontWeight:800, color:"var(--cream)", textDecoration:"underline", flexShrink:0}}>
                {toast.actionLabel}
              </button>
            )}
          </div>
        )}
        {backupOpen && (
          <BackupSheet
            contacts={contacts}
            onClose={()=>setBackupOpen(false)}
            onCopied={()=>setToast("Respaldo copiado al portapapeles")}
            onImport={(parsed)=>{ setContacts(parsed.map(normalizeContact)); setBackupOpen(false); setToast("Respaldo importado"); }}
          />
        )}
        {logOpen && (
          <QuickLogSheet
            contacts={contacts}
            onClose={()=>setLogOpen(false)}
            onLogCall={logCall}
            onToast={setToast}
          />
        )}
      </div>
      {(screen==="home" || screen==="add") && (
        <TabBar active={screen} onChange={(k)=>setScreen(k)} onOpenLog={()=>setLogOpen(true)} />
      )}
    </div>
  );
}

function StatusBar(){
  return (
    <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 22px 2px", fontSize:".78rem", fontWeight:700, color:"var(--ink)"}}>
      <span className="tabular">9:41</span>
      <div style={{display:"flex", alignItems:"center", gap:5}}>
        <svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 9.5 L1 11 L3 11 L3 7.5 Z M5 6.5 L5 11 L7 11 L7 4.5 Z M9 4 L9 11 L11 11 L11 1.5 Z" fill="var(--ink)"/></svg>
        <svg width="20" height="11" viewBox="0 0 24 12" fill="none"><rect x="1" y="1.5" width="19" height="9" rx="2.5" stroke="var(--ink)" strokeWidth="1.2"/><rect x="2.5" y="3" width="14" height="6" rx="1.2" fill="var(--ink)"/><rect x="21" y="4" width="2" height="4" rx="1" fill="var(--ink)"/></svg>
      </div>
    </div>
  );
}

function MockupShell(){
  return (
    <div style={{minHeight:"100vh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:18, padding:"48px 16px"}}>
      <div style={{textAlign:"center"}}>
        <p className="font-display" style={{margin:0, fontSize:"1.05rem", fontWeight:600, color:"#F4EEDD"}}>KeepBonds</p>
        <p style={{margin:"2px 0 0", fontSize:".75rem", color:"#C7BDA4"}}>Prototipo interactivo &middot; toca una persona o usa la barra inferior</p>
      </div>
      <div className="phone-shell">
        <div className="phone-btn" style={{left:-2, top:120, width:3, height:60, borderRadius:"0 3px 3px 0"}} />
        <div className="phone-btn" style={{left:-2, top:190, width:3, height:60, borderRadius:"0 3px 3px 0"}} />
        <div className="phone-btn" style={{right:-2, top:150, width:3, height:90, borderRadius:"3px 0 0 3px"}} />
        <div className="phone-screen">
          <StatusBar />
          <App />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MockupShell/>);

</script>
